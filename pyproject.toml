[build-system]
requires = [
  "setuptools >= 77",
  "setuptools-scm >= 8",
]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-magic"
description = "msgspec-style typed conversion for plain dataclasses and TypedDicts, in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tim Hatch", email = "tim@timhatch.com" },
]
keywords = ["config", "dataclass", "typeddict", "validation", "toml", "yaml", "json"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
  "parse-errors >= 0.7.0, < 1.0",
  "tomli >= 2.0; python_version < '3.11'",
  "tree-sitter < 0.26",
]

[project.urls]
Homepage = "https://github.com/advice-animal/minimal-magic"
Repository = "https://github.com/advice-animal/minimal-magic"
Issues = "https://github.com/advice-animal/minimal-magic/issues"

[project.optional-dependencies]
dev = [
  "build >= 1",
  "checkdeps == 0.9.0",
  "mypy == 1.19.1",
  "ruff == 0.15.6",
]
test = [
  "coverage >= 7.14",
  "hypothesis",
  "pytest >= 8",
  "pytest-benchmark",
  "PyYAML",
]
yaml = [
  "PyYAML",
]
bench = [
  "msgspec",
  "pydantic",
]

[project.scripts]
minimal-magic = "minimal_magic.__main__:main"

[tool.setuptools]
packages = { find = {} }
include-package-data = true

[tool.setuptools.package-data]
"minimal_magic" = ["py.typed"]

[tool.setuptools_scm]
version_file = "minimal_magic/_version.py"

[tool.coverage.run]
branch = true
parallel = true
source = ["minimal_magic", "tests"]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "-ra --benchmark-quiet --benchmark-name=short"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I", # isort
]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR2004", # Magic value used instead of constant (only in tests)
]
